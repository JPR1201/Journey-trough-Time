<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>LAST ANCHOR - Final Build</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { 
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #000;
                font-family: sans-serif;
            }
            canvas { 
                display: block;
                margin: auto;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
        </style>
    </head>
    <body>
        <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
        <script>
            // --- LEVEL & BOSS CONFIGURATION DATA ---
            let currentLevel = 1; 
            let levelTransitioning = false;
            
            const levelConfigs = {
                1: {
                    backgroundAsset: 'arena-1',
                    allowJetpack: false,
                    allowGrapple: false,
                    allowNormalJump: true,
                    
                    playerIdleAsset: 'player-lvl1-idle', 
                    playerWidth: 1280 * 0.07,
                    playerHeight: 720 * 0.150,
                    
                    hitboxScaleX: 1.0,
                    hitboxScaleY: 1.0,
                    hitboxOffsetX: 0.0,
                    hitboxOffsetY: 0.0,
                    
                    // LEVEL 1 BOSS: WOLF 
                    bossSpriteKey: 'boss-lvl1-idle-right', 
                    bossWidth: 1280 * 0.16, 
                    bossHeight: 720 * 0.28,  

                    // --- NEW: BOSS HITBOX REFINEMENT ---
                    bossHitboxScaleX: 0.70, 
                    bossHitboxScaleY: 0.75, // Squashes the hitbox height
                    bossHitboxOffsetX: 0.15,
                    bossHitboxOffsetY: 0.25, // Pushes the hitbox down to the feet

                    enemyDamage: 15,
                    bossMaxHealth: 300, 
                    bossSpeed: 380,
                    bossJumpPower: -780, 
                    bossAIProfile: 'BEAST', 
                    bossBaseFacingRight: true, 
                    attackWindupTime: 300, 
                    attackCooldownTime: 800,

                    platforms: [
                        { x: 1280 * 0.325,  y: 720 * 0.9,  width: 1280 * 0.25,  height: 100 },
                        { x: 1280 * 0.725,  y: 720 * 0.9,  width: 1280 * 0.25,  height: 100 },
                        { x: 0,           y: 720 * 0.675,width: 875,         height: 40 },
                        { x: 1280 * 0.83, y: 720 * 0.675,width: 350,         height: 40 },
                        { x: 0,           y: 720 * 0.5,  width: 100,         height: 720 },
                        { x: 1280,        y: 720 * 0.5,  width: 100,         height: 720 }
                    ]
                },
                2: {
                    backgroundAsset: 'arena-2', 
                    allowJetpack: false,        
                    allowGrapple: true,       
                    allowNormalJump: true,       
                    
                    playerIdleAsset: 'player-lvl2-idle', 
                    playerWidth: 1280 * 0.15, 
                    playerHeight: 720 * 0.25,

                    hitboxScaleX: 0.35,     
                    hitboxScaleY: 0.60,     
                    hitboxOffsetX: 0.325,   
                    hitboxOffsetY: 0.40,    
                    
                    // LEVEL 2 BOSS: ROMAN 
                    bossSpriteKey: 'boss-lvl2-idle-right', 
                    bossWidth: 1280 * 0.15,
                    bossHeight: 720 * 0.25,

                    // --- NEW: BOSS HITBOX REFINEMENT ---
                        bossHitboxScaleX: 0.60, 
                        bossHitboxScaleY: 0.80, 
                        bossHitboxOffsetX: 0.20,
                        bossHitboxOffsetY: 0.20,

                    enemyDamage: 35,
                    bossMaxHealth: 400, 
                    bossSpeed: 220, 
                    bossJumpPower: -700,
                    bossAIProfile: 'WARRIOR', 
                    bossBaseFacingRight: true,
                    attackWindupTime: 500, 
                    attackCooldownTime: 1200, 

                    platforms: [
                        { x: 1280 * 0.5,  y: 720 * 0.85, width: 1280,        height: 40 },
                        { x: 0,           y: 720 * 0.5,  width: 100,         height: 720 },
                        { x: 1280,        y: 720 * 0.5,  width: 100,         height: 720 }
                    ]
                }
            };

            let player;
            let cursors;
            let platformGroup;
            let keys;
            let W, H;
            let isAttacking = false;
            let attackCooldown = 0;
            let punchDamage = 15; 
            let grappling = false;
            let grapplePoint = { x: 0, y: 0 };
            let grappleLine;
            let fuel = 100;
            let maxFuel = 100;
            let onGround = false;
            let currentSprite = 'idle';
            let playerHealth = 100;
            
            let healthText, fuelText, levelText, enemyHealthText;
            let objectiveText, controlsText;
            
            let gameOver = false;
            let facingRight = true; 
            let enemy = null;

            let isInvincible = false;
            let invincibilityTimer = 0;
            const invincibilityDuration = 800; 

            const config = {
                type: Phaser.AUTO,
                backgroundColor: '#0a0a0a',
                scale: {
                    mode: Phaser.Scale.FIT,
                    autoCenter: Phaser.Scale.CENTER_BOTH,
                    width: 1280,
                    height: 720
                },
                physics: {
                    default: 'arcade',
                    arcade: { 
                        gravity: { y: 1400 }, 
                        debug: false 
                    }
                },
                scene: { preload, create, update }
            };

            const game = new Phaser.Game(config);

            function preload() {

                this.load.audio('bgmusic', 'Assets/bgmusic.MP3')

                // Backgrounds
                this.load.image('arena-1', 'Assets/Backgrounds/arena-1.jpg');
                this.load.image('arena-2', 'Assets/Backgrounds/arena-2.png'); 

                // Lvl 1 Player
                this.load.image('player-lvl1-idle', 'Assets/Player/Idle Right Barb.png');
                this.load.image('player-lvl1-walk-right', 'Assets/Player/Walk Right Barb.png');
                this.load.image('player-lvl1-walk-left', 'Assets/Player/Walk Right Barb.png'); 
                this.load.image('player-lvl1-punch-right', 'Assets/Player/Punch Right Barb.png');
                this.load.image('player-lvl1-punch-left', 'Assets/Player/Punch Left Barb.png');

                // Lvl 2 Player
                this.load.image('player-lvl2-idle', 'Assets/Player/Idle Roman.png');       
                this.load.image('player-lvl2-walk-right', 'Assets/Player/Walk Right Roman.png');
                this.load.image('player-lvl2-walk-left', 'Assets/Player/Walk Left Roman.png');
                this.load.image('player-lvl2-punch-right', 'Assets/Player/Roman Swing Right.png'); 
                this.load.image('player-lvl2-punch-left', 'Assets/Player/Roman Swing Left.png');   

                // Lvl 1 Boss (Wolf)
                this.load.image('boss-lvl1-idle-right', 'Assets/Boss/BossLvl1 Idle Right.png');
                this.load.image('boss-lvl1-idle-left', 'Assets/Boss/BossLvl1 Idle Left.png');
                this.load.image('boss-lvl1-walk-right', 'Assets/Boss/BossLvl1 Walk Right.png');
                this.load.image('boss-lvl1-walk-left', 'Assets/Boss/BossLvl1 Walk Left.png');
                this.load.image('boss-lvl1-jump-right', 'Assets/Boss/BossLvl1 Jump Right.png');
                this.load.image('boss-lvl1-jump-left', 'Assets/Boss/BossLvl1 Jump Left.png');
                this.load.image('boss-lvl1-attack-right', 'Assets/Boss/BossLvl1 Attack Right.png');
                this.load.image('boss-lvl1-attack-left', 'Assets/Boss/BossLvl1 Attack Left.png');

                // Lvl 2 Boss (Roman) 
                this.load.image('boss-lvl2-idle-right', 'Assets/Player/Idle Roman.png');
                this.load.image('boss-lvl2-idle-left', 'Assets/Player/Idle Roman.png');
                this.load.image('boss-lvl2-walk-right', 'Assets/Player/Walk Right Roman.png');
                this.load.image('boss-lvl2-walk-left', 'Assets/Player/Walk Left Roman.png');
                this.load.image('boss-lvl2-jump-right', 'Assets/Player/Jump Right Roman.png');
                this.load.image('boss-lvl2-jump-left', 'Assets/Player/Jump Left Roman.png');
                this.load.image('boss-lvl2-attack-right', 'Assets/Player/Attack Right Roman.png');
                this.load.image('boss-lvl2-attack-left', 'Assets/Player/Attack Left Roman.png');
            }

            function applyHitboxSettings(spriteObj, settings) {
                const bw = spriteObj.width * settings.hitboxScaleX;
                const bh = spriteObj.height * settings.hitboxScaleY;
                const ox = spriteObj.width * settings.hitboxOffsetX;
                const oy = spriteObj.height * settings.hitboxOffsetY;
                    spriteObj.body.setSize(bw, bh);
                    spriteObj.body.setOffset(ox, oy);
            }

            function create() {
                W = 1280; H = 720;
                levelTransitioning = false;
                const currentSetting = levelConfigs[currentLevel];

                this.add.image(0, 0, currentSetting.backgroundAsset).setDisplaySize(W, H).setOrigin(0, 0);

                player = this.physics.add.sprite(W * 0.2, H * 0.5, currentSetting.playerIdleAsset);
                player.setOrigin(0.5, 1.0);
                player.setDisplaySize(currentSetting.playerWidth, currentSetting.playerHeight);
                    applyHitboxSettings(player, currentSetting);
                player.setCollideWorldBounds(currentLevel !== 1);
                player.setMaxVelocity(550, 1100);
                player.setDragX(1500);

                platformGroup = this.physics.add.staticGroup();
                currentSetting.platforms.forEach(plat => addPlatform(this, plat.x, plat.y, plat.width, plat.height));
                this.physics.add.collider(player, platformGroup);
                        
                cursors = this.input.keyboard.createCursorKeys();
                keys = this.input.keyboard.addKeys('A,D,W,R');
                grappleLine = this.add.graphics();

                this.sound.play('bgmusic', {
                    loop: true,
                    volume: 0.5 // Adjust volume between 0 and 1
                });
                
            
               // Initialize Boss
                const bossSpawnY = currentLevel === 1 ? H * 0.5 : H * 0.3;
                enemy = this.physics.add.sprite(W * 0.8, bossSpawnY, currentSetting.bossSpriteKey);
                enemy.setOrigin(0.5, 1.0);
                enemy.setDisplaySize(currentSetting.bossWidth, currentSetting.bossHeight);

                let ebw;
                let ebh;
                let eox;
                let eoy;

                if (currentLevel === 1) {
                    // Preserve the original wolf hitbox behavior.
                    ebw = enemy.displayWidth * currentSetting.bossHitboxScaleX;
                    ebh = enemy.displayHeight * currentSetting.bossHitboxScaleY;
                    eox = (enemy.displayWidth - ebw) / 2;
                    eoy = enemy.displayHeight * 0.20;
                } else {
                    // Roman uses source-texture coordinates for correct scaling.
                    ebw = enemy.width * currentSetting.bossHitboxScaleX;
                    ebh = enemy.height * currentSetting.bossHitboxScaleY;
                    eox = enemy.width * currentSetting.bossHitboxOffsetX;
                    eoy = enemy.height * currentSetting.bossHitboxOffsetY;
                }

                enemy.body.setSize(ebw, ebh);
                enemy.body.setOffset(eox, eoy);

                enemy.body.setAllowGravity(true);
                enemy.body.setCollideWorldBounds(currentLevel !== 1);
                enemy.body.setBounce(0);
                enemy.body.setMaxVelocity(1200, 1500);

                enemy.maxHealth = currentSetting.bossMaxHealth;
                enemy.health = enemy.maxHealth;
                enemy.damage = currentSetting.enemyDamage;
                enemy.profile = currentSetting.bossAIProfile;
                enemy.baseFacingRight = currentSetting.bossBaseFacingRight;
                
                enemy.state = 'IDLE'; 
                enemy.facingRight = false; 
                enemy.nextDecisionTime = 0;
                enemy.attackReadyTime = 0; 
                
                enemy.isAttacking = false;
                enemy.isStaggered = false;
                enemy.staggerNeeded = (enemy.profile === 'BEAST') ? 3 : 5; 
                enemy.hitCount = 0;
                
                this.physics.add.collider(enemy, platformGroup, function(e, p) {
                        e.currentPlatform = p;
                });

                    this.physics.add.overlap(player, enemy, function(p, e) {
                        if (!gameOver && !isInvincible && e.state === 'ATTACKING' && !e.isStaggered) {
                            takeDamage(e.damage);
                            isInvincible = true;
                            invincibilityTimer = game.scene.scenes[0].time.now + invincibilityDuration;
                            player.setTint(0xff5555);
                            
                            const knockX = player.x < e.x ? -400 : 400;
                            player.setVelocity(knockX, -300);
                        }
                    });

                // UI
                healthText = this.add.text(16, 16, 'Health: 100', { fontSize: '24px', fill: '#00d4ff', fontStyle: 'bold' }).setScrollFactor(0);
                fuelText = this.add.text(16, 46, 'Fuel: 100', { fontSize: '20px', fill: '#00d4ff' }).setScrollFactor(0);
                levelText = this.add.text(16, 70, 'Level: ' + currentLevel, { fontSize: '20px', fill: '#ffff00' }).setScrollFactor(0);
                enemyHealthText = this.add.text(W - 220, 16, 'Boss: ' + enemy.health, { fontSize: '24px', fill: '#ffaaaa', fontStyle: 'bold' }).setScrollFactor(0);

                objectiveText = this.add.text(W / 2, 16, 'OBJECTIVE: DEFEAT THE BOSS', { 
                    fontSize: '22px', fill: '#ffffff', fontStyle: 'bold', stroke: '#000000', strokeThickness: 4 
                }).setOrigin(0.5, 0).setScrollFactor(0);
                
                controlsText = this.add.text(W / 2, 44, 'CONTROLS: [A/D] Move | [Space] Jump | [W] Attack | [Mouse] Grapple | [R] Restart', { 
                    fontSize: '16px', fill: '#cccccc', stroke: '#000000', strokeThickness: 3 
                }).setOrigin(0.5, 0).setScrollFactor(0);

                this.input.on('pointerdown', function(pointer) {
                    if (!levelConfigs[currentLevel].allowGrapple) return;
                    const gameX = pointer.worldX, gameY = pointer.worldY;
                    let hitPlatform = false;
                    platformGroup.getChildren().forEach(function(platform) {
                        const hw = platform.width / 2, hh = platform.height / 2;
                        if (gameX >= platform.x - hw && gameX <= platform.x + hw && gameY >= platform.y - hh && gameY <= platform.y + hh) {
                            hitPlatform = true;
                            grapplePoint.x = gameX; grapplePoint.y = platform.y - hh - 20;
                        }
                    });
                    if (hitPlatform) grappling = true;
                });
                this.input.on('pointerup', () => grappling = false);
            }

            function update() {
                if (gameOver) {
                    if (keys.R.isDown) {
                        gameOver = false; playerHealth = 100; fuel = 100; isInvincible = false;
                        currentLevel = 1;

                        this.scene.restart();
                    }
                    return;
                }

                const currentSetting = levelConfigs[currentLevel];
                const now = this.time.now;
                const lvlPrefix = `player-lvl${currentLevel}-`;
                onGround = player.body.blocked.down || player.body.touching.down;

                if (isInvincible && now >= invincibilityTimer) {
                    isInvincible = false;
                    player.clearTint(); 
                }

                if (onGround && fuel < maxFuel) {
                    fuel = Math.min(maxFuel, fuel + 1);
                    fuelText.setText('Fuel: ' + Math.floor(fuel));
                }
                
                if (!isAttacking) {
                    if (cursors.left.isDown || keys.A.isDown) {
                        facingRight = false;
                        setSprite(lvlPrefix + 'walk-left');
                        player.setVelocityX(-420); 
                    } else if (cursors.right.isDown || keys.D.isDown) {
                        facingRight = true;
                        setSprite(lvlPrefix + 'walk-right');
                        player.setVelocityX(420); 
                    } else {
                        setSprite(lvlPrefix + 'idle');
                    }
                    
                    if ((cursors.space.isDown) && currentSetting.allowJetpack && fuel > 0) {
                        player.setVelocityY(-380); 
                        fuel -= 1.0; 
                        fuelText.setText('Fuel: ' + Math.floor(fuel));
                    }

                    if (Phaser.Input.Keyboard.JustDown(cursors.space) && currentSetting.allowNormalJump && onGround) {
                        player.setVelocityY(-800); 
                    }
                }

                if (attackCooldown > 0) {
                    attackCooldown--;
                    if (attackCooldown === 0) isAttacking = false;
                }

                if (keys.W.isDown && attackCooldown === 0) {
                    const attackSprite = facingRight ? (lvlPrefix + 'punch-right') : (lvlPrefix + 'punch-left');
                    setSprite(attackSprite);
                    attackCooldown = 15;
                    isAttacking = true;
                    checkHit(punchDamage);
                }

                if (currentSetting.allowGrapple) updateGrapple();
                else { grappleLine.clear(); grappling = false; }

                if (enemy && enemy.active) {
                    enemyHealthText.setText('Boss: ' + Math.max(0, Math.floor(enemy.health)));
                    updateBossLogic(now, currentSetting);
                    updateBossAnimation();
                    }

                if (currentLevel === 1 && player.body.bottom > H + 40) {
                    player.setPosition(W * 0.2, H * 0.5);
                    player.setVelocity(0, 0);
                    takeDamage(20);
                }

                if (currentLevel === 1 && enemy && enemy.active && enemy.body.bottom > H + 40) {
                    enemy.setPosition(W * 0.8, currentLevel === 1 ? H * 0.5 : H * 0.3);
                    enemy.setVelocity(0, 0);
                    enemy.state = 'IDLE';
                    enemy.nextDecisionTime = now + 300;
                    enemy.attackReadyTime = now + 500;
                    enemy.currentPlatform = null;
                    enemy.health = Math.max(0, enemy.health - 20);
                    enemyHealthText.setText('Boss: ' + Math.floor(enemy.health));
                }
                // Check if the boss is defeated
                if (enemy && enemy.active && enemy.health <= 0) {
                    if (currentLevel === 1) {
                        currentLevel = 2; // Advance to Level 2
                        playerHealth = 100; // Optional: Heal player for the next level
                        fuel = 100;
                        this.scene.restart(); // Rebuilds the scene with Level 2 data!
                    } else if (currentLevel === 2) {
                        // You beat the entire game! Handle game win screen here.
                        objectiveText.setText('VICTORY! YOU DEFEATED ALL BOSSES');
                        enemy.destroy();
                    }
                }
            }

            function updateBossLogic(now, config) {
                const enemyOnGround = enemy.body.blocked.down || enemy.body.touching.down;
                enemy.body.setDragX(enemyOnGround ? 1200 : 0);

                // --- ENRAGED PHASE CALCULATIONS ---
                const isEnraged = enemy.health < enemy.maxHealth * 0.5;
                const speedMultiplier = isEnraged ? 1.4 : 1.0; 
                const cdMultiplier = isEnraged ? 0.6 : 1.0; 
                
                // Add visual indicator for enraged mode
                if (isEnraged && !enemy.isStaggered && enemy.state !== 'WINDUP') {
                    enemy.setTint(0xffaaaa); 
                }

                // --- PREDICTIVE TRACKING ---
                const predictedPlayerX = player.x + (player.body.velocity.x * 0.4); 
                const distX = Math.abs(predictedPlayerX - enemy.x);
                const distY = Math.abs(player.y - enemy.y);
                const dirToPlayer = predictedPlayerX > enemy.x ? 1 : -1;

                if (!enemy.isStaggered && enemy.state !== 'ATTACK_RECOVERY' && enemy.state !== 'ATTACKING') {
                    enemy.facingRight = predictedPlayerX > enemy.x;
                }

                if (enemy.isStaggered) {
                    enemy.body.setVelocityX(0);
                    if (now > enemy.stateEndTime) {
                        enemy.isStaggered = false;
                        enemy.hitCount = 0;
                        enemy.state = 'IDLE';
                        enemy.nextDecisionTime = now + 100;
                    }
                    return; 
                }

                if (enemy.state === 'WINDUP') {
                    enemy.body.setVelocityX(0); 
                    if (now > enemy.stateEndTime) {
                        enemy.state = 'ATTACKING';
                        enemy.stateEndTime = now + 400; 
                        enemy.body.setVelocityX(enemy.facingRight ? config.bossSpeed * 1.5 * speedMultiplier : -config.bossSpeed * 1.5 * speedMultiplier);
                    }
                    return;
                }

                if (enemy.state === 'ATTACKING') {
                    if (now > enemy.stateEndTime) {
                        enemy.state = 'ATTACK_RECOVERY';
                        enemy.stateEndTime = now + 300; 
                        enemy.body.setVelocityX(0);
                    }
                    return;
                }

                if (enemy.state === 'ATTACK_RECOVERY') {
                    if (now > enemy.stateEndTime) {
                        enemy.state = 'IDLE';
                        enemy.nextDecisionTime = now + 100;
                        enemy.attackReadyTime = now + (config.attackCooldownTime * cdMultiplier);
                    }
                    return;
                }

                if (enemy.state === 'LEAPING') {
                    if (enemyOnGround && enemy.body.velocity.y >= 0 && now > enemy.jumpLockTime) {
                        enemy.state = 'ATTACK_RECOVERY';
                        enemy.stateEndTime = now + 300;
                        enemy.body.setVelocityX(0);
                    }
                    return;
                }

                if (now >= enemy.nextDecisionTime) {
                    enemy.body.setVelocityX(0);

                    if (distX < 150 && distY < 90 && now > enemy.attackReadyTime) {
                        enemy.state = 'WINDUP';
                        enemy.stateEndTime = now + (config.attackWindupTime * cdMultiplier); 
                        return;
                    }

                    if (enemy.profile === 'BEAST') {
                        if (distY > 100 && enemyOnGround) {
                            executePlatformJump(config);
                        } else if (distX > 250 && enemyOnGround) {
                            if (Math.random() < (isEnraged ? 0.4 : 0.25)) executePlatformJump(config);
                            else {
                                enemy.state = 'CHASING';
                                enemy.nextDecisionTime = now + 400;
                            }
                        } else {
                            enemy.state = 'CHASING';
                            enemy.nextDecisionTime = now + 400;
                        }
                    } else if (enemy.profile === 'WARRIOR') {
                        if (distY > 150 && enemyOnGround) {
                            executePlatformJump(config);
                        } else {
                            enemy.state = 'CHASING';
                            enemy.nextDecisionTime = now + (isEnraged ? 500 : 800);
                        }
                    }
                }

                if (enemy.state === 'CHASING') {
                    let safeToMove = true;
                    if (enemy.currentPlatform && enemyOnGround) {
                        const plat = enemy.currentPlatform;
                        const edgeX = dirToPlayer === 1 ? (plat.x + plat.width/2) : (plat.x - plat.width/2);
                        if (Math.abs(enemy.x - edgeX) < 40 && distY > 100) safeToMove = false;
                    }

                    if (safeToMove) {
                        enemy.body.setVelocityX(dirToPlayer * config.bossSpeed * speedMultiplier);
                    } else {
                        enemy.body.setVelocityX(0);
                        enemy.state = 'IDLE';
                        enemy.nextDecisionTime = now + 200;
                    }
                }
            }

            function executePlatformJump(config) {
                let validTargets = platformGroup.getChildren().filter(p => p !== enemy.currentPlatform);
                
                validTargets.sort((a, b) => {
                    const distA = Math.abs(a.y - player.y) + Math.abs(a.x - player.x);
                    const distB = Math.abs(b.y - player.y) + Math.abs(b.x - player.x);
                    return distA - distB;
                });
                
                if (validTargets.length > 0) {
                    const target = validTargets[0];
                    const dx = target.x - enemy.x;
                    const dy = (target.y - target.height / 2) - enemy.y;

                    let jumpPower = config.bossJumpPower;
                    if (dy < -100) jumpPower *= 1.15; 
                    
                    enemy.body.setVelocityY(jumpPower);
                    
                    const grav = game.config.physics.arcade.gravity.y;
                    const timeInAir = Math.abs(jumpPower * 2 / grav);
                    const requiredVx = dx / (timeInAir || 1);
                    
                    const finalVx = Phaser.Math.Clamp(requiredVx, -config.bossSpeed * 3, config.bossSpeed * 3);
                    enemy.body.setVelocityX(finalVx);
                    
                    enemy.state = 'LEAPING'; 
                    enemy.jumpLockTime = game.scene.scenes[0].time.now + 400; 
                    enemy.nextDecisionTime = game.scene.scenes[0].time.now + 1200;
                } else {
                    enemy.state = 'CHASING';
                    enemy.nextDecisionTime = game.scene.scenes[0].time.now + 500;
                }
            }

            function updateBossAnimation() {
                const enemyOnGround = enemy.body.blocked.down || enemy.body.touching.down;
                let desiredAction = 'idle';

                if (enemy.isStaggered) {
                    desiredAction = 'idle';
                    enemy.setTint(0xff0000);
                } else {
                    if (enemy.state === 'WINDUP') enemy.setTint(0xffbbbb);
                    else if (enemy.health >= enemy.maxHealth * 0.5) enemy.clearTint();

                    if (enemy.state === 'ATTACKING' || enemy.state === 'ATTACK_RECOVERY' || enemy.state === 'WINDUP') {
                        desiredAction = 'attack';
                    } else if (enemy.state === 'LEAPING' || !enemyOnGround) {
                        desiredAction = enemy.body.velocity.y < 0 ? 'jump' : 'fall';
                    } else if (Math.abs(enemy.body.velocity.x) > 10) {
                        desiredAction = 'walk'; 
                    }
                }

                const dir = enemy.facingRight ? 'right' : 'left';
                let targetDirectionalKey = `boss-lvl${currentLevel}-${desiredAction}-${dir}`;
                let targetBaseKey = `boss-lvl${currentLevel}-${desiredAction}`;

                if (desiredAction === 'fall' && !game.scene.scenes[0].textures.exists(targetDirectionalKey) && !game.scene.scenes[0].textures.exists(targetBaseKey)) {
                    targetDirectionalKey = `boss-lvl${currentLevel}-jump-${dir}`;
                    targetBaseKey = `boss-lvl${currentLevel}-jump`;
                }

                if (game.scene.scenes[0].textures.exists(targetDirectionalKey)) {
                    if (enemy.texture.key !== targetDirectionalKey) enemy.setTexture(targetDirectionalKey);
                    enemy.setFlipX(false); 
                } else if (game.scene.scenes[0].textures.exists(targetBaseKey)) {
                    if (enemy.texture.key !== targetBaseKey) enemy.setTexture(targetBaseKey);
                    if (enemy.baseFacingRight) {
                        enemy.setFlipX(!enemy.facingRight);
                    } else {
                        enemy.setFlipX(enemy.facingRight);
                    }
                } else {
                    const fallbackDir = `boss-lvl${currentLevel}-idle-${dir}`;
                    const fallbackBase = `boss-lvl${currentLevel}-idle`;
                    
                    if (game.scene.scenes[0].textures.exists(fallbackDir)) {
                        enemy.setTexture(fallbackDir);
                        enemy.setFlipX(false);
                    } else if (game.scene.scenes[0].textures.exists(fallbackBase)) {
                        enemy.setTexture(fallbackBase);
                        enemy.setFlipX(!enemy.facingRight);
                    }
                }
            }

            function setSprite(name) {
                if (currentSprite !== name && game.scene.scenes[0].textures.exists(name)) {
                    player.setTexture(name);
                    if (name.includes('punch-left')) player.setFlipX(false);
                    else if (name.includes('punch-right')) player.setFlipX(false);
                    else if (name.includes('walk-left')) player.setFlipX(currentLevel === 1); 
                    else if (name.includes('walk-right')) player.setFlipX(false);
                    else player.setFlipX(!facingRight);

                    const currentSetting = levelConfigs[currentLevel];
                    player.setDisplaySize(currentSetting.playerWidth, currentSetting.playerHeight);
                        applyHitboxSettings(player, currentSetting);
                    currentSprite = name;
                }
            }

            function takeDamage(amount) {
                playerHealth = Math.max(0, playerHealth - amount);
                healthText.setText('Health: ' + playerHealth);
                if (playerHealth <= 0) triggerGameOver(); 
            }

            function triggerGameOver() {
                gameOver = true;
                player.setTint(0xff0000);
            }

            function addPlatform(scene, x, y, width, height = 20) {
                const p = scene.add.rectangle(x, y, width, height, 0xffffff, 0); 
                scene.physics.add.existing(p, true);
                platformGroup.add(p);
            }

            function updateGrapple() {
                if (!grappling) { grappleLine.clear(); return; }
                grappleLine.clear();
                grappleLine.lineStyle(3, 0x00d4ff, 1);
                grappleLine.beginPath();
                grappleLine.moveTo(player.x, player.y - (H * 0.075));
                grappleLine.lineTo(grapplePoint.x, grapplePoint.y);
                grappleLine.strokePath();

                const dx = grapplePoint.x - player.x;
                const dy = grapplePoint.y - player.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist > 15) {
                    const pullStrength = 150;
                    player.setVelocity(player.body.velocity.x + (dx/dist)*pullStrength * 0.9, player.body.velocity.y + (dy/dist)*pullStrength * 0.9);
                } else {
                    player.body.reset(grapplePoint.x, grapplePoint.y);
                    player.setVelocity(0, 0);
                    grappling = false;
                }
            }

            function checkHit(damage) {
                if (!enemy || !enemy.active) return;

                const pw = player.displayWidth, ph = player.displayHeight;
                const attackW = pw * 1.2, attackH = ph * 0.8;
                const attackX = facingRight ? player.x + pw * 0.4 : player.x - pw * 0.4;
                const attackY = player.y - ph * 0.5;
                const attackBox = new Phaser.Geom.Rectangle(attackX - attackW/2, attackY - attackH/2, attackW, attackH);

                if (Phaser.Geom.Intersects.RectangleToRectangle(attackBox, enemy.getBounds())) {
                    const now = game.scene.scenes[0].time.now;

                    let actualDamage = damage;
                    if (enemy.state === 'ATTACKING' || enemy.state === 'LEAPING' || enemy.state === 'WINDUP') {
                        actualDamage = Math.floor(damage * 0.5); 
                    }

                    enemy.health = Math.max(0, enemy.health - actualDamage);
                    enemy.hitCount++;

                    if (enemy.hitCount >= enemy.staggerNeeded && !enemy.isStaggered) {
                        enemy.isStaggered = true;
                        enemy.isAttacking = false; 
                        enemy.stateEndTime = now + 1200; 
                        const knockX = enemy.x > player.x ? 250 : -250;
                        enemy.body.setVelocity(knockX, -200);
                    }

                    if (enemy.health <= 0 && !levelTransitioning) {
                        levelTransitioning = true;
                        enemy.destroy();
                        enemy = null;
                        enemyHealthText.setText('Boss: Defeated');

                        const defeatText = game.scene.scenes[0].add.text(W / 2, H / 2, 'AREA CLEARED!', { 
                            fontSize: '48px', fill: '#ffff00', fontStyle: 'bold', stroke: '#000000', strokeThickness: 6 
                        }).setOrigin(0.5).setScrollFactor(0);

                        game.scene.scenes[0].time.delayedCall(3000, () => {
                            if (currentLevel === 1) {
                                currentLevel = 2;
                                game.scene.scenes[0].scene.restart();
                            } else {
                                defeatText.setText('GAME CLEARED!');
                            }
                        });
                    }
                }
            }
        </script>
    </body>
</html>
